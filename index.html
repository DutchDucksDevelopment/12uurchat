<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Google</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { font-family: system-ui, Arial; margin:0; padding:0; display:flex; height:100vh; }
  .panel { margin:auto; width:100%; max-width:720px; display:flex; flex-direction:column; height:90vh; border:1px solid #ddd; border-radius:8px; overflow:hidden; }
  #log { flex:1; padding:12px; overflow:auto; background:#fafafa; }
  #inputRow { display:flex; gap:8px; padding:10px; border-top:1px solid #eee; align-items:center; }
  #msg { flex:1; padding:8px; font-size:14px; }
  #name { width:160px; padding:6px; }
  button { padding:8px 12px; }
  .meta { color:#666; font-size:12px; margin-bottom:8px; }
  .msg { margin:6px 0; }
  .me { font-weight:600; }
  .others { color:#222; }
  .ts { color:#999; font-size:11px; margin-left:6px; }
</style>
</head>
<body>
<div class="panel">
  <div style="padding:12px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:12px;">
    <strong>12 uur chat</strong>
    <label style="font-size:13px;color:#444">Name: <input id="name" /></label>
    <button id="saveNameBtn">Save</button>
    <span id="status" style="margin-left:10px;color:#666">disconnected</span>
  </div>
  <div id="log"></div>
  <div id="inputRow">
    <input id="msg" placeholder="Type a message" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
(function(){
  // Replace with your deployed Worker WebSocket host, e.g.:
  // const WORKER_WS_HOST = "wss://chat-worker.YOUR_SUBDOMAIN.workers.dev";
  const WORKER_WS_HOST = "wss://serverchat.eagerlauncher.workers.dev";
  const ROOM = "main"; // fixed single room

  // localStorage keys
  const LS_NAME = 'chat_name_v1';
  const LS_HISTORY = 'chat_history_v1'; // JSON array of {name, text, ts, clientId}

  const nameInput = document.getElementById('name');
  const saveNameBtn = document.getElementById('saveNameBtn');
  const sendBtn = document.getElementById('sendBtn');
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const msgIn = document.getElementById('msg');

  let ws = null;
  let clientId = null;
  let localName = loadName() || generateAnonName();

  nameInput.value = localName;

  // Load chat history from localStorage and render
  const history = loadHistory();
  for (const item of history) renderMessage(item);

  function saveName(name) {
    localStorage.setItem(LS_NAME, name);
    localName = name;
  }
  function loadName() {
    return localStorage.getItem(LS_NAME);
  }
  function saveHistory(arr) {
    try { localStorage.setItem(LS_HISTORY, JSON.stringify(arr.slice(-500))); } catch (e) {}
  }
  function loadHistory() {
    try {
      const raw = localStorage.getItem(LS_HISTORY);
      if (!raw) return [];
      return JSON.parse(raw);
    } catch (e) { return []; }
  }
  function pushHistory(entry) {
    const h = loadHistory();
    h.push(entry);
    saveHistory(h);
  }

  function generateAnonName() {
    return 'Anon-' + Math.random().toString(36).slice(2,8);
  }

  function appendLine(el) {
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function renderMessage(msg) {
    const d = document.createElement('div');
    d.className = 'msg ' + (msg.clientId && msg.clientId === clientId ? 'me' : 'others');
    const nameSpan = document.createElement('strong');
    nameSpan.textContent = msg.name || ('User ' + (msg.clientId ? msg.clientId.slice(0,8) : ''));
    const tsSpan = document.createElement('span');
    tsSpan.className = 'ts';
    tsSpan.textContent = new Date(msg.ts || Date.now()).toLocaleTimeString();
    const textDiv = document.createElement('div');
    textDiv.textContent = msg.text;
    d.appendChild(nameSpan);
    d.appendChild(tsSpan);
    d.appendChild(document.createElement('br'));
    d.appendChild(textDiv);
    appendLine(d);
  }

  function setStatus(s) { status.textContent = s; }

  function connect() {
    if (!WORKER_WS_HOST || WORKER_WS_HOST.includes("<WORKER_WS_HOST>")) {
      setStatus("set WORKER_WS_HOST in the file");
      return;
    }
    if (ws) ws.close();
    const url = WORKER_WS_HOST + '/?room=' + ROOM;
    ws = new WebSocket(url);
    ws.addEventListener('open', () => setStatus('connected'));
    ws.addEventListener('close', () => { setStatus('disconnected'); ws = null; });
    ws.addEventListener('error', () => { setStatus('error'); });
    ws.addEventListener('message', ev => {
      try {
        const data = JSON.parse(ev.data);
        handleMessage(data);
      } catch (e) {}
    });
  }

  function handleMessage(data) {
    if (data.type === 'welcome') {
      clientId = data.clientId;
      appendMeta('You joined the main room');
      // Update any history items that were stored before we had clientId (optional)
      return;
    }
    if (data.type === 'join') {
      appendMeta('User joined: ' + data.clientId);
      return;
    }
    if (data.type === 'leave') {
      appendMeta('User left: ' + data.clientId);
      return;
    }
	if (data.type === 'message') {
	  // ignore server echo for messages we already rendered locally
	  if (data.clientId === clientId) return;
	  const msg = {
	    name: data.name || ('User ' + (data.clientId ? data.clientId.slice(0,8) : '')),
	    text: data.text,
	    ts: data.ts || Date.now(),
	    clientId: data.clientId
	  };
	  renderMessage(msg);
	  pushHistory(msg);
	  return;
	}

    appendMeta(JSON.stringify(data));
  }

  function appendMeta(text) {
    const d = document.createElement('div');
    d.className = 'meta';
    d.textContent = text;
    appendLine(d);
  }

  saveNameBtn.addEventListener('click', () => {
    const v = (nameInput.value || '').trim();
    if (!v) return;
    saveName(v);
    appendMeta('Name saved as: ' + v);
  });

  sendBtn.addEventListener('click', sendMessage);
  msgIn.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function sendMessage() {
    const text = msgIn.value.trim();
    if (!text) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) { appendMeta('Not connected'); return; }
    const payload = { type: 'message', text, name: localName };
    ws.send(JSON.stringify(payload));
    // Optimistically render & store
    const localMsg = { name: localName, text, ts: Date.now(), clientId: clientId || null };
    renderMessage(localMsg);
    pushHistory(localMsg);
    msgIn.value = '';
  }

  // start
  connect();
})();
</script>
</body>
</html>
